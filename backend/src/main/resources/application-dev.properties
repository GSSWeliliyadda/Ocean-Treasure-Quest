# Local Development Profile (never use these settings in production)
# Preserves the existing MySQL ocean_treasure_quest database for localhost development.
# Username and password must still be supplied via DB_USERNAME / DB_PASSWORD (env vars or gitignored .env).
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ocean_treasure_quest?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}

# Development-only Hibernate behavior
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}

# Preserve localhost HTTP authentication session cookies
server.servlet.session.cookie.secure=false

