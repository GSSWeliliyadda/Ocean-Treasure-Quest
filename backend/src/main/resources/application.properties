spring.application.name=backend
server.port=${SERVER_PORT:8080}

# Activate local dev profile by default unless SPRING_PROFILES_ACTIVE is explicitly set (e.g., prod)
spring.profiles.default=dev

# Import optional gitignored local configuration files (OS environment variables take precedence)
spring.config.import=optional:file:.env[.properties],optional:file:./backend/.env[.properties],optional:file:./application-local.properties,optional:file:./backend/application-local.properties,optional:classpath:application-local.properties

# Database Configuration (MySQL) - supply values via environment variables or gitignored local file
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Production-Safe Defaults (overridden in application-dev.properties for local dev)
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false

# Session & Cookie Configuration
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m
