# Production Profile (activate with SPRING_PROFILES_ACTIVE=prod)
# Requires DB_URL, DB_USERNAME, and DB_PASSWORD with production TLS settings and pre-created schema.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Enforce HTTPS-only session cookies in production deployments
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=lax

